name: ci

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository. No job needs a write token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit so that a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- --deny warnings
      - run: cargo clippy --all-targets --no-default-features -- --deny warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: RUSTDOCFLAGS="--deny warnings" cargo doc --no-deps --all-features
      - run: RUSTDOCFLAGS="--deny warnings" cargo doc --no-deps --no-default-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep this version equal to `rust-version` in Cargo.toml.
      - run: rustup toolchain install 1.85 --profile minimal
      - run: cargo +1.85 check --all-targets --all-features
      - run: cargo +1.85 check --all-targets --no-default-features

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --all-features
      - run: scripts/check-security.sh --skip-deny

  weight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: scripts/check-weight.sh

  # Fails when the committed expectations no longer match what real systemd prints.
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: oracle/check.sh
