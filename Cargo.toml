[package]
name = "oncalendar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Parse systemd calendar event expressions (OnCalendar=) and compute when they elapse next."
license = "MIT OR Apache-2.0"
repository = "https://github.com/chrysaor/oncalendar"
readme = "README.md"
keywords = ["systemd", "calendar", "timer", "schedule", "parser"]
categories = ["date-and-time", "parser-implementations"]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
default = ["system-tzdb"]
cron = []
jiff = ["dep:jiff"]
system-tzdb = ["jiff", "jiff/std", "jiff/tzdb-zoneinfo", "jiff/tzdb-bundle-platform"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
jiff = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
jiff = { version = "1", default-features = false, features = ["std", "tzdb-bundle-always"] }

[[test]]
name = "oracle"
required-features = ["jiff"]

[[test]]
name = "cron"
required-features = ["cron", "jiff"]

[[bench]]
name = "speed"
harness = false
required-features = ["jiff"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
